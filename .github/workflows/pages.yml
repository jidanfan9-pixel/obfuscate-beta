name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          API_BASE_URL: ${{ vars.LUAUGUARD_API_URL }}
        run: |
          mkdir -p _site
          cp -R frontend/. _site/
          cp docs/openapi.yaml _site/openapi.yaml
          node <<'NODE'
          const fs = require('node:fs');
          const url = process.env.API_BASE_URL || '';
          fs.writeFileSync('_site/api-config.js', `window.LUAUGUARD_CONFIG = { apiBaseUrl: ${JSON.stringify(url)} };\n`);
          NODE
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
